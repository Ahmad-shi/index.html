<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>نظام إدارة البيانات</title>
</head>
<body bgcolor="#FFFBEA" style="font-family: Arial, sans-serif; padding: 20px;">

    <!-- 1. نموذج الدخول -->
    <form id="myForm">
        <fieldset style="width: 300px; margin: 30px auto; background: #fff; padding: 15px;">
            <legend><b>تسجيل الدخول</b></legend>
            <div>
                <label for="username">اسم المستخدم</label> <br>
                <input id="username" type="text" placeholder="اسم المستخدم" required style="width: 90%;">
            </div>
            <br>
            <div>
                <label for="pass">كلمة السر</label> <br>
                <input id="pass" type="password" required style="width: 90%;">
            </div>
            <br>
            <div>
                <button type="button" onclick="check()">دخول</button>
            </div>
        </fieldset>
    </form>

    <!-- 2. واجهة الأدمن -->
    <div id="adminView" style="display: none;">
        <h3>صفحة الأدمن (إضافة وتعديل وحذف)</h3>
        
        <fieldset style="width: 400px; margin-bottom: 20px; background: #fff; padding: 15px;">
            <legend id="formTitle"><b>إضافة / تعديل مشترك</b></legend>
            
            <input type="hidden" id="editKey" value=""> 
            
            <label>الاسم الكامل:</label><br>
            <input type="text" id="newName" placeholder="الاسم الكامل" style="width: 90%;"><br><br>
            
            <label>آخر شهر دفع:</label><br>
            <input type="text" id="newDate" placeholder="مثال: 12/4/2026" style="width: 90%;"><br><br>
            
            <label>عدد الشهور:</label><br>
            <input type="number" id="newMonths" placeholder="عدد الشهور" style="width: 90%;"><br><br>
            
            <button type="button" id="saveBtn" onclick="saveData()">حفظ البيانات</button>
            <button type="button" id="cancelBtn" onclick="resetForm()" style="display:none;">إلغاء التعديل</button>
        </fieldset>

        <h3>جدول بيانات المشتركين</h3>
        <table border="1" cellpadding="8" cellspacing="0" width="100%" style="background: #fff;">
            <thead>
                <tr bgcolor="#ddd">
                    <th>الاسم</th>
                    <th>آخر شهر دفع</th>
                    <th>عدد الشهور</th>
                </tr>
                <tr>
                    <th>ll</th>
                    <th>22/6/2026</th>
                    <th>2</th>
                </tr>
            </thead>
            <tbody id="adminTableBody">
                <!-- تحميل البيانات تلقائياً من Firebase -->
            </tbody>
        </table>
        <br>
        <button onclick="logout()">تسجيل الخروج</button>
    </div>

    <!-- 3. واجهة المستخدم -->
    <div id="userView" style="display: none;">
        <h3>صفحة المشتركين (عرض فقط)</h3>
        <table border="1" width="100%" cellpadding="8" cellspacing="0" style="background: #fff;">
            <thead>
                <tr bgcolor="#eee">
                    <th>الاسم</th>
                    <th>آخر شهر دفع</th>
                    <th>عدد الشهور</th>
                </tr>
            </thead>
            <tbody id="userTableBody">
                <!-- تحميل البيانات من Firebase -->
            </tbody>
        </table>
        <br>
        <button onclick="logout()">تسجيل الخروج</button>
    </div>

    <!-- 4. مكتبات Firebase -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        // ⚠️ استبدل المفاتيح ببيانات مشروعك من Firebase Console
        const firebaseConfig = {
            apiKey: "ضع_الـ_apiKey_هنا",
            authDomain: "PROJECT_ID.firebaseapp.com",
            databaseURL: "https://PROJECT_ID-default-rtdb.firebaseio.com",
            projectId: "PROJECT_ID",
            storageBucket: "PROJECT_ID.appspot.com",
            messagingSenderId: "XXXXX",
            appId: "XXXXX"
        };

        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        function check() {
            var u = document.getElementById("username").value.trim();
            var p = document.getElementById("pass").value.trim();

            if (u === "admin" && p === "1234") {
                document.getElementById("myForm").style.display = "none";
                document.getElementById("adminView").style.display = "block";
                loadAdminData();
            } else if (u === "user" && p === "1122") {
                document.getElementById("myForm").style.display = "none";
                document.getElementById("userView").style.display = "block";
                loadUserData();
            } else {
                alert("بيانات الدخول غير صحيحة!");
            }
        }

        // --- دالة الحفظ (إضافة جديدة أوتعديل سطر قائم) ---
        function saveData() {
            var key = document.getElementById("editKey").value;
            var name = document.getElementById("newName").value.trim();
            var date = document.getElementById("newDate").value.trim();
            var months = document.getElementById("newMonths").value.trim();

            if (!name || !date || !months) {
                alert("يرجى تعبئة جميع الخانات!");
                return;
            }

            var itemData = { name: name, date: date, months: months };

            if (key !== "") {
                // تعديل مباشر بالـ key
                database.ref('subscribers/' + key).update(itemData, function(error) {
                    if (error) {
                        alert("حدث خطأ أثناء التعديل: " + error.message);
                    } else {
                        alert("تم تعديل البيانات بنجاح!");
                        resetForm();
                    }
                });
            } else {
                // إضافة جديدة
                database.ref('subscribers/').push(itemData, function(error) {
                    if (error) {
                        alert("حدث خطأ أثناء الإضافة: " + error.message);
                    } else {
                        alert("تمت الإضافة بنجاح!");
                        resetForm();
                    }
                });
            }
        }

        // --- دالة جلب بيانات سطر محدد وتعبئتها في الخانات فوق للتعديل ---
        function prepareEdit(key) {
            database.ref('subscribers/' + key).once('value').then((snapshot) => {
                const data = snapshot.val();
                if (data) {
                    document.getElementById("editKey").value = key;
                    document.getElementById("newName").value = data.name;
                    document.getElementById("newDate").value = data.date;
                    document.getElementById("newMonths").value = data.months;

                    document.getElementById("formTitle").innerHTML = "<b>تعديل بيانات: " + data.name + "</b>";
                    document.getElementById("saveBtn").innerText = "حفظ التعديلات";
                    document.getElementById("cancelBtn").style.display = "inline-block";
                    
                    // التمرير لأعلى الصفحة للتركيز على الخانات
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                }
            });
        }

        // --- دالة الحذف ---
        function deleteRow(key) {
            if (confirm("هل أنت متأكد من الحذف؟")) {
                database.ref('subscribers/' + key).remove();
            }
        }

        // --- تفريغ الخانات ---
        function resetForm() {
            document.getElementById("editKey").value = "";
            document.getElementById("newName").value = "";
            document.getElementById("newDate").value = "";
            document.getElementById("newMonths").value = "";

            document.getElementById("formTitle").innerHTML = "<b>إضافة / تعديل مشترك</b>";
            document.getElementById("saveBtn").innerText = "حفظ البيانات";
            document.getElementById("cancelBtn").style.display = "none";
        }

        // --- تحميل جدول الأدمن ---
        function loadAdminData() {
            database.ref('subscribers/').on('value', (snapshot) => {
                const tbody = document.getElementById("adminTableBody");
                tbody.innerHTML = "";

                if (snapshot.exists()) {
                    snapshot.forEach((childSnapshot) => {
                        const key = childSnapshot.key;
                        const data = childSnapshot.val();

                        tbody.innerHTML += `<tr>
                            <td><b>${data.name}</b></td>
                            <td>${data.date}</td>
                            <td>${data.months}</td>
                            <td>
                                <button type="button" onclick="prepareEdit('${key}')">تعديل ✏️</button>
                                <button type="button" onclick="deleteRow('${key}')">حذف ❌</button>
                            </td>
                        </tr>`;
                    });
                } else {
                    tbody.innerHTML = `<tr><td colspan="4">لا توجد بيانات حالياً</td></tr>`;
                }
            });
        }

        // --- تحميل جدول المستخدم ---
        function loadUserData() {
            database.ref('subscribers/').on('value', (snapshot) => {
                const tbody = document.getElementById("userTableBody");
                tbody.innerHTML = "";

                if (snapshot.exists()) {
                    snapshot.forEach((childSnapshot) => {
                        const data = childSnapshot.val();
                        tbody.innerHTML += `<tr>
                            <td><b>${data.name}</b></td>
                            <td>${data.date}</td>
                            <td>${data.months}</td>
                        </tr>`;
                    });
                } else {
                    tbody.innerHTML = `<tr><td colspan="3">لا توجد بيانات حالياً</td></tr>`;
                }
            });
        }

        // --- تسجيل الخروج ---
        function logout() {
            document.getElementById("adminView").style.display = "none";
            document.getElementById("userView").style.display = "none";
            document.getElementById("myForm").style.display = "block";
            document.getElementById("username").value = "";
            document.getElementById("pass").value = "";
        }
    </script>
</body>
</html>
