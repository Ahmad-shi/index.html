<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>نظام إدارة البيانات الكامل</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background-color: #FFFBEA; }
        fieldset { background: #fff; padding: 15px; border-radius: 8px; border: 1px solid #ccc; margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; background: #fff; margin-top: 10px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: center; }
        th { background-color: #007bff; color: white; }
        button { padding: 6px 12px; cursor: pointer; border-radius: 4px; border: none; }
        .btn-main { background-color: #28a745; color: white; }
        .btn-edit { background-color: #ffc107; color: black; }
        .btn-delete { background-color: #dc3545; color: white; }
        .btn-cancel { background-color: #6c757d; color: white; }
        input[type="text"], input[type="password"], input[type="number"] { padding: 6px; border: 1px solid #ccc; border-radius: 4px; }
    </style>
</head>
<body>

    <!-- 1. شاشة تسجيل الدخول -->
    <div id="loginSection" style="width: 320px; margin: 50px auto;">
        <fieldset>
            <legend><b>تسجيل الدخول</b></legend>
            <div style="margin-bottom: 10px;">
                <label>اسم المستخدم:</label><br>
                <input type="text" id="username" style="width: 95%;">
            </div>
            <div style="margin-bottom: 10px;">
                <label>كلمة السر:</label><br>
                <input type="password" id="pass" style="width: 95%;">
            </div>
            <button class="btn-main" onclick="login()">دخول</button>
        </fieldset>
    </div>

    <!-- 2. واجهة الأدمن -->
    <div id="adminView" style="display: none;">
        <h2>لوحة تحكم الأدمن (تحكم كامل)</h2>

        <!-- قسم إضافة عمود جديد -->
        <fieldset style="background: #eef7ff;">
            <legend><b>➕ إضافة عمود جديد للجدول</b></legend>
            <input type="text" id="newColInput" placeholder="اسم العمود الجديد (مثلاً: رقم الهاتف)" style="width: 250px;">
            <button class="btn-main" onclick="addNewColumn()">إضافة العمود</button>
        </fieldset>

        <!-- قسم إضافة / تعديل مشترك (صفوف) -->
        <fieldset>
            <legend id="formTitle"><b>➕ إضافة / تعديل صف</b></legend>
            <input type="hidden" id="editRowIndex" value="-1">
            
            <div id="dynamicFieldsContainer">
                <!-- تتولد خانات الإدخال هنا تلقائياً حسب الأعمدة -->
            </div>
            <br>
            <button class="btn-main" id="saveBtn" onclick="saveRowData()">حفظ الصف</button>
            <button class="btn-cancel" id="cancelBtn" onclick="resetRowForm()" style="display: none;">إلغاء التعديل</button>
        </fieldset>

        <h3>جدول البيانات (الأدمن)</h3>
        <table>
            <thead>
                <tr id="adminHeaderRow"></tr>
            </thead>
            <tbody id="adminTableBody"></tbody>
        </table>
        <br>
        <button class="btn-cancel" onclick="logout()">تسجيل الخروج</button>
    </div>

    <!-- 3. واجهة المستخدم -->
    <div id="userView" style="display: none;">
        <h2>صفحة عرض البيانات (المستخدم)</h2>
        <table>
            <thead>
                <tr id="userHeaderRow"></tr>
            </thead>
            <tbody id="userTableBody"></tbody>
        </table>
        <br>
        <button class="btn-cancel" onclick="logout()">تسجيل الخروج</button>
    </div>

    <script>
        // إعدادات البيانات الأولية في المتصفح
        let columns = JSON.parse(localStorage.getItem('my_columns')) || ["الاسم", "آخر شهر دفع", "عدد الشهور"];
        let rows = JSON.parse(localStorage.getItem('my_rows')) || [
            {"الاسم": "أحمد محمود", "آخر شهر دفع": "04/2026", "عدد الشهور": "3"},
            {"الاسم": "محمد علي", "آخر شهر دفع": "05/2026", "عدد الشهور": "1"}
        ];

        // حفظ الحالات في التخزين المحلي
        function syncStorage() {
            localStorage.setItem('my_columns', JSON.stringify(columns));
            localStorage.setItem('my_rows', JSON.stringify(rows));
        }

        // تسجيل الدخول
        function login() {
            let u = document.getElementById("username").value.trim();
            let p = document.getElementById("pass").value.trim();

            if (u === "admin" && p === "1234") {
                document.getElementById("loginSection").style.display = "none";
                document.getElementById("adminView").style.display = "block";
                renderAdminUI();
            } else if (u === "user" && p === "1122") {
                document.getElementById("loginSection").style.display = "none";
                document.getElementById("userView").style.display = "block";
                renderUserUI();
            } else {
                alert("اسم المستخدم أو كلمة السر غير صحيحة!");
            }
        }

        // --- 1. بناء واجهة الأدمن ---
        function renderAdminUI() {
            renderFormFields();
            renderAdminTable();
        }

        // توليد خانات الإدخال بناءً على الأعمدة الموجودة
        function renderFormFields() {
            let container = document.getElementById("dynamicFieldsContainer");
            container.innerHTML = "";
            columns.forEach(col => {
                container.innerHTML += `
                    <div style="margin-bottom: 8px;">
                        <label><b>${col}:</b></label><br>
                        <input type="text" id="field_${col}" placeholder="أدخل ${col}" style="width: 90%;">
                    </div>
                `;
            });
        }

        // إضافة عمود جديد
        function addNewColumn() {
            let colName = document.getElementById("newColInput").value.trim();
            if (!colName) {
                alert("يرجى كتابة اسم العمود!");
                return;
            }
            if (columns.includes(colName)) {
                alert("هذا العمود موجود بالفعل!");
                return;
            }

            columns.push(colName);
            // إعطاء قيمة فارغة للعمود الجديد في الصفوف القديمة
            rows.forEach(r => { if (!r[colName]) r[colName] = "-"; });

            syncStorage();
            document.getElementById("newColInput").value = "";
            renderAdminUI();
            alert("تمت إضافة العمود بنجاح!");
        }

        // حفظ صف (إضافة جديدة أو تعديل)
        function saveRowData() {
            let index = parseInt(document.getElementById("editRowIndex").value);
            let rowData = {};
            let isComplete = true;

            columns.forEach(col => {
                let val = document.getElementById(`field_${col}`).value.trim();
                if (!val) isComplete = false;
                rowData[col] = val;
            });

            if (!isComplete) {
                alert("يرجى تعبئة جميع الخانات!");
                return;
            }

            if (index >= 0) {
                // تعديل صف قائم
                rows[index] = rowData;
                alert("تم تعديل البيانات بنجاح!");
            } else {
                // إضافة صف جديد
                rows.push(rowData);
                alert("تمت إضافة الصف بنجاح!");
            }

            syncStorage();
            resetRowForm();
            renderAdminTable();
        }

        // تجهيز بيانات الصف للتعديل
        function startEditRow(index) {
            document.getElementById("editRowIndex").value = index;
            let targetRow = rows[index];

            columns.forEach(col => {
                document.getElementById(`field_${col}`).value = targetRow[col] || '';
            });

            document.getElementById("formTitle").innerHTML = "<b>✏️ تعديل الصف رقم (" + (index + 1) + ")</b>";
            document.getElementById("saveBtn").innerText = "حفظ التعديلات";
            document.getElementById("cancelBtn").style.display = "inline-block";
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // حذف صف
        function deleteRow(index) {
            if (confirm("هل أنت متأكد من حذف هذا الصف؟")) {
                rows.splice(index, 1);
                syncStorage();
                renderAdminTable();
            }
        }

        // إغلاق نموذج التعديل ورجوعه للإضافة
        function resetRowForm() {
            document.getElementById("editRowIndex").value = "-1";
            columns.forEach(col => {
                let field = document.getElementById(`field_${col}`);
                if (field) field.value = "";
            });
            document.getElementById("formTitle").innerHTML = "<b>➕ إضافة / تعديل صف</b>";
            document.getElementById("saveBtn").innerText = "حفظ الصف";
            document.getElementById("cancelBtn").style.display = "none";
        }

        // رسم جدول الأدمن
        function renderAdminTable() {
            let header = document.getElementById("adminHeaderRow");
            let tbody = document.getElementById("adminTableBody");

            header.innerHTML = "";
            columns.forEach(col => { header.innerHTML += `<th>${col}</th>`; });
            header.innerHTML += `<th>التحكم</th>`;

            tbody.innerHTML = "";
            if (rows.length === 0) {
                tbody.innerHTML = `<tr><td colspan="${columns.length + 1}">لا توجد بيانات حالياً</td></tr>`;
                return;
            }

            rows.forEach((row, i) => {
                let tr = "<tr>";
                columns.forEach(col => {
                    tr += `<td>${row[col] || '-'}</td>`;
                });
                tr += `<td>
                    <button class="btn-edit" onclick="startEditRow(${i})">تعديل ✏️</button>
                    <button class="btn-delete" onclick="deleteRow(${i})">حذف ❌</button>
                </td></tr>`;
                tbody.innerHTML += tr;
            });
        }

        // --- 2. بناء واجهة المستخدم ---
        function renderUserUI() {
            let header = document.getElementById("userHeaderRow");
            let tbody = document.getElementById("userTableBody");

            header.innerHTML = "";
            columns.forEach(col => { header.innerHTML += `<th>${col}</th>`; });

            tbody.innerHTML = "";
            if (rows.length === 0) {
                tbody.innerHTML = `<tr><td colspan="${columns.length}">لا توجد بيانات حالياً</td></tr>`;
                return;
            }

            rows.forEach(row => {
                let tr = "<tr>";
                columns.forEach(col => {
                    tr += `<td>${row[col] || '-'}</td>`;
                });
                tr += "</tr>";
                tbody.innerHTML += tr;
            });
        }

        // تسجيل الخروج
        function logout() {
            document.getElementById("adminView").style.display = "none";
            document.getElementById("userView").style.display = "none";
            document.getElementById("loginSection").style.display = "block";
            document.getElementById("username").value = "";
            document.getElementById("pass").value = "";
        }
    </script>
</body>
</html>
