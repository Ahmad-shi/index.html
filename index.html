<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>تسجيل الدخول</title>
</head>
<body bgcolor="#FFFBEA">

    <!-- نموذج الدخول -->
    <form id="myForm">
        <fieldset>
            <legend>login</legend>
            <div>
                <label for="username">user name</label>
                <input id="username" type="text" placeholder="اسم المستخدم" required>
            </div>
            <br>
            <div>
                <label for="pass">password</label>
                <input id="pass" type="password" required>
            </div>
            <br>
            <div>
                <button type="button" onclick="check()">دخول</button>
            </div>
        </fieldset>
    </form>

    <!-- واجهة الأدمن -->
    <div id="adminView" style="display: none;">
        <h3>صفحة الأدمن</h3>
        <table border="1" width="400">
            <tr><th>الاسم</th><th>الحالة</th></tr>
            <tr><td>محمود سليمان القليلي</td><td>أدمن</td></tr>
        </table>
    </div>

    <!-- واجهة المستخدم -->
    <div id="userView" style="display: none;">
        <h3>صفحة المستخدم</h3>
        <table border="1" width="400">
            <tr><th>الاسم</th><th>الحالة</th></tr>
            <tr><td>مستخدم عادي</td><td>مستفيد</td></tr>
        </table>
    </div>

    <script>
        function check() {
            var u = document.getElementById("username").value.trim();
            var p = document.getElementById("pass").value.trim();

            if (u === "admin" && p === "1234") {
                document.getElementById("myForm").style.display = "none";
                document.getElementById("adminView").style.display = "block";
                document.getElementById("userView").style.display = "none";
            } else if (u === "user" && p === "1122") {
                document.getElementById("myForm").style.display = "none";
                document.getElementById("userView").style.display = "block";
                document.getElementById("adminView").style.display = "none";
            } else {
                alert("البيانات غير صحيحة!");
            }
        }
    </script>

</body>
</html>
